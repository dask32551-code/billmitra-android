name: Build Billmitra APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip latest source
        run: |
          Z=$(ls Billmitra-android-*.zip | sort -V | tail -1)
          echo "Using $Z"
          unzip -q -o "$Z"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log
      - name: Show compile errors
        if: failure()
        run: grep -nE "^e: |error:|FAILED|What went wrong" -A3 build.log | head -80 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Billmitra-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            build.log
