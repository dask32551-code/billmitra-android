name: Build Billmitra APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Unzip latest source
        run: |
          ZIP=$(ls *-v[0-9]*.zip | sort -V | tail -n 1)
          echo "Using zip: $ZIP"
          rm -rf src_unzipped
          mkdir src_unzipped
          unzip -q "$ZIP" -d src_unzipped
          GRADLEW=$(find src_unzipped -name gradlew -not -path "*/node_modules/*" | head -n 1)
          APPDIR=$(dirname "$GRADLEW")
          echo "Project dir: $APPDIR"
          echo "APPDIR=$APPDIR" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: ${{ env.APPDIR }}
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        working-directory: ${{ env.APPDIR }}
        run: |
          grep -nE "^e: |error:|FAILED|What went wrong" -A3 build.log | head -80 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Billmitra-apk
          path: |
            ${{ env.APPDIR }}/app/build/outputs/apk/release/app-release.apk
            ${{ env.APPDIR }}/build.log
